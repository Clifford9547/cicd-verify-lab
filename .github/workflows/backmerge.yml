name: backmerge
on:
  workflow_dispatch:
    inputs:
      branch: {required: true, type: string}
permissions:
  contents: read
  pull-requests: write
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${{ inputs.branch }}" --title "backmerge ${{ inputs.branch }}" --body "created by GITHUB_TOKEN"
        env:
          GH_TOKEN: ${{ github.token }}
