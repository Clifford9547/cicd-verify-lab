name: envsecret-test
on: workflow_dispatch
jobs:
  no_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "no_env secret present=${{ secrets.ENV_ONLY != '' }}"
  with_env:
    runs-on: ubuntu-latest
    environment: notifytest
    steps:
      - run: echo "with_env secret present=${{ secrets.ENV_ONLY != '' }}"
  prd_from_main:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - run: echo "reached prd job"
